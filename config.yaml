model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      temperature: 0.3
      max_tokens: 4096
      
  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      temperature: 0.5
      max_tokens: 8192

# Konfigurasi Router (untuk load balancing & fallback)
router_settings:
  routing_strategy: "usage-based"  # atau "latency-based"
  enable_fallback: true
  fallbacks: [{"deepseek-chat": ["deepseek-reasoner"]}]
  num_retries: 2
  request_timeout: 60

# Cache settings untuk menghemat biaya
cache_settings:
  type: redis  # atau "memory" untuk sementara
  ttl: 3600  # 1 jam
  mode: "conditional"  # hanya cache jika prompt identik