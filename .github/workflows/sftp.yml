name: Test SFTP Connection

on:
  workflow_dispatch:

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Check secrets presence
        run: |
          [ -n '${{ secrets.SFTP_HOST }}' ] && echo "HOST OK" || echo "HOST EMPTY"
          [ -n '${{ secrets.SFTP_PORT }}' ] && echo "PORT OK" || echo "PORT EMPTY"
          [ -n '${{ secrets.SFTP_USER }}' ] && echo "USER OK" || echo "USER EMPTY"
          [ -n '${{ secrets.SFTP_PASSWORD }}' ] && echo "PASSWORD OK" || echo "PASSWORD EMPTY"

      - name: Test SFTP connection
        run: |
          sshpass -p '${{ secrets.SFTP_PASSWORD }}' sftp \
            -o StrictHostKeyChecking=no \
            -P '${{ secrets.SFTP_PORT }}' \
            '${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}' <<'EOF'
          pwd
          ls
          cd sop
          ls
          bye
          EOF
      - name: Test basic connectivity
        run: |
            echo "Testing DNS..."
            nslookup renodoc.asiatirtapharma.com
            echo "Testing port..."
            nc -zv renodoc.asiatirtapharma.com 7235 -w 10
            echo "Testing curl..."
            curl -v telnet://renodoc.asiatirtapharma.com:7235 --max-time 10