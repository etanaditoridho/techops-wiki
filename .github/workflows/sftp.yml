name: Test SFTP Connection

on:
  workflow_dispatch:

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass netcat-openbsd

      - name: Test basic connectivity
        run: |
          echo "=== DNS Check ==="
          nslookup renodoc.asiatirtapharma.com
          echo "=== Port Check ==="
          nc -zv renodoc.asiatirtapharma.com 7235 -w 10 || echo "Port tidak bisa diakses"

      - name: Test SFTP connection
        run: |
          sshpass -p '${{ secrets.SFTP_PASSWORD }}' sftp \
            -o StrictHostKeyChecking=no \
            -P '${{ secrets.SFTP_PORT }}' \
            '${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}' <<'EOF'
          pwd
          ls
          bye